[workspace]
members = [
    "crates/freeshow-core",
    "crates/freeshow-media",
    "crates/freeshow-network",
    "crates/freeshow-audio",
    "crates/freeshow-files",
    "crates/freeshow-system",
    "crates/freeshow-api",
    "crates/freeshow-imports",
    "crates/freeshow-browse",
    "crates/freeshow-import-effects",
    "crates/freeshow-assets",
    "crates/freeshow-thumbnails",
    "crates/freeshow-asset-plans",
    "crates/freeshow-thumbnail-effects",
    "crates/freeshow-exif",
    "crates/freeshow-documents",
    "crates/freeshow-remotes",
]
exclude = ["src-tauri", "vendor/socketioxide"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/rob-345/freeshow-rust"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
