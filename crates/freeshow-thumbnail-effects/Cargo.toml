[package]
name = "freeshow-thumbnail-effects"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/rob-345/freeshow-rust"

[dependencies]
freeshow-thumbnails = { path = "../freeshow-thumbnails" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
getrandom = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde_json = "1"
png = "=0.18.1"
