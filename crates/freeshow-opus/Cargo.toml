[package]
name = "freeshow-opus"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace]

[dependencies]
libloading = "0.7.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["time"] }

[features]
test-harness = []

[[bin]]
name = "freeshow-opus"
path = "src/main.rs"
required-features = ["test-harness"]
