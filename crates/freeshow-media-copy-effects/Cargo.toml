[package]
name = "freeshow-media-copy-effects"
autobins = false
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/rob-345/freeshow-rust"


[dependencies]
freeshow-media-copy = { path = "../freeshow-media-copy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.4"
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[[example]]
name = "freeshow-media-copy-effects"
path = "src/main.rs"
