[package]
name = "freeshow-exif"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Bounded native READ_EXIF compatibility service"

[workspace]

[dependencies]
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "freeshow-exif-parity"
path = "src/bin/parity.rs"

[profile.dev]
debug = 0
incremental = false
