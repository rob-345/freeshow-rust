[package]
name = "freeshow-network"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/rob-345/freeshow-rust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
