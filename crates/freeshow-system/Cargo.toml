[package]
name = "freeshow-system"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Bounded native system information for FreeShow renderer contracts"

# Standalone until coordinator integration into the shared workspace.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_SystemInformation"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }

[[bin]]
name = "freeshow-system-parity"
path = "src/bin/parity.rs"

[profile.dev]
debug = 0
incremental = false
