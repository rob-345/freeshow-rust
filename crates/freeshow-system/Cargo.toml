[package]
name = "freeshow-system"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Bounded native system information for FreeShow renderer contracts"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
getrandom = "0.4"
tokio = { version = "1", features = ["sync", "rt", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_SystemInformation", "Win32_System_Registry"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
tempfile = "3"

[[bin]]
name = "freeshow-system-parity"
path = "src/bin/parity.rs"
