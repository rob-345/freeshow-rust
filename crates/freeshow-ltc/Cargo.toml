[package]
name = "freeshow-ltc"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Bounded verified libltc capability and owned source-compatible codecs"
build = "build.rs"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
libc = "0.2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "freeshow-ltc-parity"
path = "src/bin/parity.rs"

[profile.dev]
debug = 0
incremental = false
