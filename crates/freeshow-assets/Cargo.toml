[package]
name = "freeshow-assets"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Bounded capability-based local media byte transport"

[workspace]

[dependencies]
bytes = "1"
futures-core = "0.3"
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros", "io-util", "io-std"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "freeshow-assets-parity"
path = "src/bin/parity.rs"

[profile.dev]
debug = 0
incremental = false
