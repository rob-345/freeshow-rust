[package]
name = "freeshow-ffmpeg-download"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Bounded FFmpeg download preparation without final installation"

[dependencies]
bytes = "1"
crc32fast = "1"
flate2 = "1"
getrandom = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "freeshow-ffmpeg-download-parity"
path = "src/bin/parity.rs"
