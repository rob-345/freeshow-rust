[package]
name = "freeshow-ai-status"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Bounded explicit Nemotron no-model integrity status preparation"


[features]
default = []
test-harness = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
ryu-js = "0.2.2"
tokio = { version = "1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "freeshow-ai-status-parity"
path = "src/bin/parity.rs"
