[package]
name = "freeshow-api"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/rob-345/freeshow-rust"

[workspace]
exclude = ["vendor/socketioxide"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
encoding_rs = "0.8"
flate2 = "1"
form_urlencoded = "1"
hyper = { version = "1", features = ["server", "http1"] }
indexmap = "2"
hyper-util = { version = "0.1", features = ["tokio", "service"] }
percent-encoding = "2"
regex = "1"
ryu-js = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
socketioxide = { version = "=0.18.7", path = "vendor/socketioxide" }
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros", "io-util", "io-std"] }
tower = { version = "0.5", features = ["util"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
