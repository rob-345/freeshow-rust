[package]
name = "freeshow-timecode"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Bounded source timecode routing and LTC lifecycle intents"

[workspace]

[dependencies]
freeshow-midi = { path = "../freeshow-midi" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[[bin]]
name = "freeshow-timecode-parity"
path = "src/bin/parity.rs"

[profile.dev]
debug = 0
incremental = false
