[package]
name = "freeshow-ai-local"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/rob-345/freeshow-rust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
