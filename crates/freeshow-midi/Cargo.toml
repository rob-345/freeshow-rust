[package]
name = "freeshow-midi"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Bounded source-compatible MIDI and MTC logic"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ryu-js = "0.2.2"

[[bin]]
name = "freeshow-midi-parity"
path = "src/bin/parity.rs"
