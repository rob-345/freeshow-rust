name: Rust migration

on:
  push:
    branches: [rust-migration]
  pull_request:
  workflow_dispatch:
    inputs:
      require_full_parity:
        description: Enforce the complete migration acceptance gate
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: rustup show
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run rust:snapshot
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run rust:test
      - run: npm run rust:parity:report
      - if: inputs.require_full_parity == true
        run: npm run rust:parity:gate

  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev webkit2gtk-driver xvfb dbus-x11
      - run: rustup show
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run rust:frontend:build
      - run: cargo build --manifest-path src-tauri/Cargo.toml --features custom-protocol
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - run: cargo install tauri-driver --locked
      - run: xvfb-run -a dbus-run-session -- python3 tests/desktop/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-linux-evidence
          path: test-output-rust/desktop
