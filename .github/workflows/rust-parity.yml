name: Rust migration

on:
  push:
    branches: [rust-migration]
  pull_request:
  workflow_dispatch:
    inputs:
      require_full_parity:
        description: Enforce the complete migration acceptance gate
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - run: git fetch --no-tags --depth=1 origin 2d94defcf98175e4f5c9504e7f4fd1d33c35c975
      - uses: actions/setup-node@v5
        with:
          # Match Node bundled by the pinned Electron 37.10.3 oracle.
          node-version: 22.21.1
          cache: npm
      - run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-core-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-rust-core-
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run rust:snapshot
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run rust:test
      - run: npm run rust:parity:report
      - if: inputs.require_full_parity == true
        run: npm run rust:parity:gate

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v5
      - run: git fetch --no-tags --depth=1 origin 2d94defcf98175e4f5c9504e7f4fd1d33c35c975
      - uses: actions/setup-node@v5
        with:
          node-version: 22.21.1
          cache: npm
      - run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-native-${{ hashFiles('Cargo.lock', 'src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-rust-native-
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run rust:frontend:build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo build --manifest-path src-tauri/Cargo.toml --features custom-protocol --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --features custom-protocol --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --features custom-protocol --test menu --test drop --test files --test system --test api --test imports --test browse --locked

  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: git fetch --no-tags --depth=1 origin 2d94defcf98175e4f5c9504e7f4fd1d33c35c975
      - uses: actions/setup-node@v5
        with:
          # Match Node bundled by the pinned Electron 37.10.3 oracle.
          node-version: 22.21.1
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev webkit2gtk-driver xvfb dbus-x11 xdotool ffmpeg python3-gi gir1.2-atspi-2.0 at-spi2-core fonts-noto-color-emoji
      - run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-desktop-${{ hashFiles('Cargo.lock', 'src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-rust-desktop-
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run rust:frontend:build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo build --manifest-path src-tauri/Cargo.toml --features custom-protocol
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --features custom-protocol --all-targets -- -D warnings
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - run: cargo test --manifest-path src-tauri/Cargo.toml --features custom-protocol --test menu --test drop --test files --test system --test api --test imports --test browse
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - run: cargo build --workspace --all-targets
      - run: node --test tests/parity/media-probe.test.mjs tests/parity/audio-metadata.test.mjs tests/parity/osc.test.mjs
        env:
          FREESHOW_REQUIRE_MEDIA_TOOLS: "1"
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - run: xvfb-run -a dbus-run-session -- /usr/bin/python3 tests/desktop/smoke.py
      - run: xvfb-run -a dbus-run-session -- /usr/bin/python3 tests/desktop/menu.py
      - run: GDK_SCALE=1 xvfb-run -a -s '-screen 0 3200x2200x24' dbus-run-session -- /usr/bin/python3 tests/desktop/drop.py
      - run: GDK_SCALE=2 xvfb-run -a -s '-screen 0 3200x2200x24' dbus-run-session -- /usr/bin/python3 tests/desktop/drop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-linux-evidence
          path: |
            test-output-rust/desktop
            test-output-rust/native-menu
            test-output-rust/native-drop
